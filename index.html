<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>200 حركة احترافية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(72, 219, 251, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 107, 107, 0.03) 0%, transparent 50%);
        }

        /* ===== الهيدر ===== */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            background: linear-gradient(180deg, rgba(15, 12, 41, 0.9) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header h1 {
            font-size: 45px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header p {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* ===== الشبكة ===== */
        .showcase {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding: 28px 100px;
            margin: 0 auto;
        }

        /* ===== البطاقة ===== */
        .effect {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 22px;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            --accent: #48dbfb;
        }

        .effect::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, var(--accent) 0%, transparent 70%);
            opacity: 0.05;
            transition: opacity 0.35s;
            pointer-events: none;
            z-index: 0;
        }

        .effect:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px -10px var(--accent);
        }

        .effect:hover::before {
            opacity: 0.18;
        }

        .effect > * {
            position: relative;
            z-index: 1;
        }

        /* ===== الترقيم تحت الحركة ===== */
        .effect-number {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            font-family: monospace;
            opacity: 0.85;
            letter-spacing: 1px;
            z-index: 2;
            margin-top: 6px;
        }

        /* ===== زر عرض الكود (أيقونة نسخ) ===== */
        .btn-code {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 10;
            padding: 0;
        }
        
        .effect:hover .btn-code {
            opacity: 1;
        }
        
        .btn-code:hover {
            background: var(--accent, #7c3aed);
            color: #fff;
            transform: scale(1.1);
        }

        .btn-code svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        /* ===== الأيقونة ===== */
        .effect svg.icon-svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        /* ===== عناصر الحركة ===== */
        .anim-box {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--accent), #fff);
        }

        .anim-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent);
            box-shadow: 0 0 25px var(--accent);
        }

        .anim-ring {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--accent);
        }

        .anim-bar {
            width: 4px;
            height: 30px;
            border-radius: 2px;
            background: linear-gradient(to top, var(--accent), transparent);
        }

        .anim-dots {
            display: flex;
            gap: 5px;
        }

        .anim-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        .anim-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== نافذة الكود ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #15152a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .modal-header h3 span {
            color: var(--accent, #48dbfb);
        }

        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 10px;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ff6b6b;
        }

        .modal-tabs {
            display: flex;
            gap: 6px;
            padding: 12px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tab {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 600;
        }

        .tab.active {
            background: rgba(72, 219, 251, 0.15);
            border-color: rgba(72, 219, 251, 0.4);
            color: #48dbfb;
        }

        .modal-body {
            padding: 18px 22px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body pre {
            background: #0a0a1a;
            border-radius: 10px;
            padding: 16px;
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.7;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 55vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 14px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .modal-info {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .copy-btn {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            border: none;
            color: #0a0a1a;
            padding: 9px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }

        .copy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(72, 219, 251, 0.4);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== الفوتر ===== */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.593);
            font-size: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.136);
            letter-spacing: 2px;
            margin-top: 30px;
        }

        /* ===== الجوال ===== */
        @media (max-width: 768px) {
            .showcase {
                padding: 16px 20px;
                gap: 15px;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .header h1 {
                font-size: 26px;
            }

            .effect {
                min-height: 160px;
                padding: 12px 8px 30px;
            }

            .effect svg.icon-svg {
                width: 32px;
                height: 32px;
            }

            .btn-code {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>200 حركة احترافية</h1>
        <p>تنوع لا نهائي • تصميم جذاب • كل الحركات تعمل مباشرة</p>
    </div>

    <div class="showcase" id="showcase"></div>

    <div class="footer">رقم تواصل المطور: +306986387315</div>

    <!-- نافذة الكود -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3>تأثير <span id="modalNum">#000</span></h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="tab active" data-tab="html">HTML</button>
                <button class="tab" data-tab="css">CSS</button>
            </div>
            <div class="modal-body">
                <pre id="modalContent"></pre>
            </div>
            <div class="modal-footer">
                <span class="modal-info" id="modalInfo"></span>
                <button class="copy-btn" id="copyBtn">نسخ الكود</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تم النسخ</div>

    <script>
        /* ============================================================
           نظام توليد 200 بطاقة عبر JavaScript
           - الترقيم تحت الحركة
           - بدون اسم للحركة
           - زر الكود = أيقونة نسخ
           ============================================================ */

        // 1) مكتبة الأيقونات SVG
        const ICONS = [
            `<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>`,
            `<circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/>`,
            `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`,
            `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
            `<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>`,
            `<path d="M12 2v4"/><path d="M12 22v-4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M22 12h-4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/>`,
            `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="21" x2="9" y2="9"/>`,
            `<path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10 10 10 0 0 1-10-10 10 10 0 0 1 10-10z"/><path d="M12 6v6l4 2"/>`,
            `<path d="M4 4v16h16"/><polyline points="4 20 10 14 14 18 20 12"/>`,
            `<path d="M12 2v20"/><path d="M2 12h20"/>`,
            `<rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="16" y1="2" x2="16" y2="22"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/>`
        ];

        // 2) لوحة الألوان
        const PALETTE = [
            "#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3",
            "#54a0ff", "#1dd1a1", "#5f27cd", "#ff9f43",
            "#00d2d3", "#ee5a24", "#c8d6e5", "#a29bfe"
        ];

        // 3) أنواع الحركات
        const MOTIONS = [
            { keyframes: "0%{transform:rotate(0)}100%{transform:rotate(360deg)}", timing: "linear" },
            { keyframes: "0%,100%{transform:scale(1)}50%{transform:scale(1.3)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{opacity:0.4;filter:brightness(0.6)}50%{opacity:1;filter:brightness(1.4)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{border-radius:6px;transform:rotate(0)}33%{border-radius:50%;transform:rotate(120deg)}66%{border-radius:6px 30px;transform:rotate(240deg)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.5) scaleY(0.6)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg)}", timing: "ease-in-out" },
            { keyframes: "0%,100%{opacity:0.2;transform:scale(0.7)}50%{opacity:1;transform:scale(1.2)}", timing: "ease-in-out" },
            { keyframes: "0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}", timing: "linear" }
        ];

        // 4) أنواع العناصر
        const ELEMENTS = [
            { cls: "anim-box", inner: "" },
            { cls: "anim-circle", inner: "" },
            { cls: "anim-ring", inner: "" },
            { cls: "anim-bar", inner: "" },
            { cls: "anim-dots", inner: "<span></span><span></span><span></span><span></span><span></span>" },
            { cls: "anim-text", inner: "نص" },
            { cls: "icon", inner: "" }
        ];

        // 5) المدد الزمنية
        const DURATIONS = ["0.6s", "0.8s", "1s", "1.2s", "1.4s", "1.6s", "1.8s", "2s", "2.4s", "2.8s"];

        // 6) بناء الحركة — بدون اسم الحركة
        function buildMotion(index) {
            const n = index + 1;
            const motion = MOTIONS[index % MOTIONS.length];
            const element = ELEMENTS[index % ELEMENTS.length];
            const duration = DURATIONS[index % DURATIONS.length];
            const animName = `anim${n}`;
            const accent = PALETTE[index % PALETTE.length];
            const icon = ICONS[index % ICONS.length];

            const css = `.effect-${n} .${element.cls.split(' ')[0]} {
    animation: ${animName} ${duration} ${motion.timing} infinite;
}
@keyframes ${animName} {
    ${motion.keyframes}
}`;

            let innerHTML;
            if (element.cls === "icon") {
                innerHTML = `<svg class="icon-svg" viewBox="0 0 24 24">${icon}</svg>`;
            } else if (element.inner) {
                innerHTML = `<div class="${element.cls}">${element.inner}</div>`;
            } else {
                innerHTML = `<div class="${element.cls}"></div>`;
            }

            // ✅ الترقيم تحت الحركة — بدون اسم
            const html = `<div class="effect effect-${n}">
    ${innerHTML}
    <span class="effect-number">#${String(n).padStart(3, "0")}</span>
</div>`;

            return { n, css, html, accent, animName };
        }

        // 7) توليد البطاقات
        (function generate() {
            const showcase = document.getElementById("showcase");
            const fragment = document.createDocumentFragment();
            const allCSS = [];

            for (let i = 0; i < 200; i++) {
                const data = buildMotion(i);
                allCSS.push(data.css);

                const card = document.createElement("div");
                card.className = `effect effect-${data.n}`;
                card.style.setProperty("--accent", data.accent);
                card.dataset.index = i;

                // العنصر المتحرك (فوق)
                const element = ELEMENTS[i % ELEMENTS.length];
                if (element.cls === "icon") {
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("class", "icon-svg");
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.innerHTML = ICONS[i % ICONS.length];
                    card.appendChild(svg);
                } else {
                    const el = document.createElement("div");
                    el.className = element.cls;
                    if (element.inner) el.innerHTML = element.inner;
                    card.appendChild(el);
                }

                // الترقيم تحت الحركة
                const num = document.createElement("span");
                num.className = "effect-number";
                num.textContent = `#${String(data.n).padStart(3, "0")}`;
                card.appendChild(num);

                // ✅ زر الكود = أيقونة نسخ
                const codeBtn = document.createElement("button");
                codeBtn.className = "btn-code";
                codeBtn.setAttribute("title", "نسخ الكود");
                codeBtn.setAttribute("aria-label", "نسخ الكود");
                codeBtn.innerHTML = `<svg viewBox="0 0 24 24">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>`;
                codeBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    openModal(i);
                });
                card.appendChild(codeBtn);

                fragment.appendChild(card);
            }

            showcase.appendChild(fragment);

            const styleTag = document.createElement("style");
            styleTag.textContent = allCSS.join("\n\n");
            document.head.appendChild(styleTag);
        })();

        /* ============================================================
           نافذة عرض ونسخ الكود
           ============================================================ */
        let currentIndex = 0;
        let currentTab = "html";

        const modalOverlay = document.getElementById("modalOverlay");
        const modalNum = document.getElementById("modalNum");
        const modalContent = document.getElementById("modalContent");
        const modalInfo = document.getElementById("modalInfo");
        const copyBtn = document.getElementById("copyBtn");
        const toast = document.getElementById("toast");

        function openModal(index) {
            currentIndex = index;
            currentTab = "html";
            const data = buildMotion(index);

            modalNum.textContent = `#${String(data.n).padStart(3, "0")}`;
            modalNum.style.color = data.accent;
            modalOverlay.querySelector(".modal").style.setProperty("--accent", data.accent);

            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelector('.tab[data-tab="html"]').classList.add("active");

            renderContent();
            modalOverlay.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function renderContent() {
            const data = buildMotion(currentIndex);
            const content = currentTab === "html" ? data.html : data.css;
            modalContent.textContent = content;
            modalInfo.textContent = `${content.split("\n").length} سطر • ${currentTab.toUpperCase()}`;
        }

        function closeModal() {
            modalOverlay.classList.remove("open");
            document.body.style.overflow = "";
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                currentTab = tab.dataset.tab;
                renderContent();
            });
        });

        document.getElementById("modalClose").addEventListener("click", closeModal);
        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
        });

        copyBtn.addEventListener("click", () => {
            const data = buildMotion(currentIndex);
            const text = currentTab === "html" ? data.html : data.css;

            const success = () => {
                copyBtn.classList.add("copied");
                const orig = copyBtn.textContent;
                copyBtn.textContent = " تم النسخ";
                showToast(" تم نسخ الكود بنجاح");
                setTimeout(() => {
                    copyBtn.classList.remove("copied");
                    copyBtn.textContent = orig;
                }, 1800);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(success).catch(() => fallback(text, success));
            } else {
                fallback(text, success);
            }
        });

        function fallback(text, cb) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.cssText = "position:fixed;top:-9999px;opacity:0;";
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            if (ok) cb();
            else showToast(" تعذّر النسخ");
        }

        let toastTimer;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
        }
    </script>

</body>

</html>
